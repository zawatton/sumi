[package]
name = "nelisp-gui-skia"
version = "0.0.0"
edition = "2021"
description = "Pure-Rust (tiny-skia) backend for nelisp-gui — builds with no system deps"
license = "CC0-1.0"

[dependencies]
nelisp-gui-core = { path = "../nelisp-gui-core" }
tiny-skia = "0.11"

[[bin]]
name = "nelisp-gui-skia-demo"
path = "src/main.rs"
