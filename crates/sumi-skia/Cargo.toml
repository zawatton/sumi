[package]
name = "sumi-skia"
version = "0.0.0"
edition = "2021"
description = "Pure-Rust (tiny-skia) backend for sumi — builds with no system deps"
license = "CC0-1.0"

[dependencies]
sumi-core = { path = "../sumi-core" }
tiny-skia = "0.11"
# pure-Rust 8x8 bitmap font (public domain) — keeps this backend system-dep-free
# while still rendering real glyphs (the Cairo backend does high-quality Pango).
font8x8 = "0.3"

[[bin]]
name = "sumi-skia-demo"
path = "src/main.rs"
