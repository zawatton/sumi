name: ci

# Runs every backend's tests. Cairo/GTK4 builds against system GTK4 on Linux
# (libgtk-4-dev), so the default toolchain links it; no MSYS2/GNU dance needed
# here. Mirrors scripts/check.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Rust tests (core + skia + cairo)
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Canvas backend tests
        run: node --test
        working-directory: backends/canvas
