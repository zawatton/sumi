<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sumi — Tauri shell</title>
    <style>
      html, body { margin: 0; background: #0b0b18; color: #cdd; font: 14px/1.5 system-ui, sans-serif; }
      main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
      canvas { border: 1px solid #333; image-rendering: pixelated; }
      p { max-width: 680px; opacity: 0.8; text-align: center; }
      code { color: #9cf; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="screen" width="680" height="680"></canvas>
      <p id="src"></p>
      <p>
        A <strong>Tauri</strong> (Rust) shell hosting the sumi
        <code>CanvasBackend</code> — the same backend the Electron shell uses. The
        Rust side carries no drawing logic; it just opens the WebView.
      </p>
    </main>

    <script type="module">
      // vendored at build time from ../../backends/canvas/src (see build.rs)
      import { CanvasBackend, parseFrame } from './lib/index.js';

      const make = (w, h) => {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        return c;
      };

      const fallbackFrame = [
        { name: 'gui-screen', nums: [0, 680, 680, 0] },
        { name: 'gui-set-color', nums: [18, 18, 44] },
        { name: 'gui-fill-rect', nums: [0, 0, 680, 680] },
        { name: 'gui-set-color', nums: [240, 220, 60] },
        { name: 'gui-set-font', nums: [28, 0], text: 'sans' },
        { name: 'gui-set-position', nums: [24, 24] },
        { name: 'gui-draw-text', text: 'sumi' },
        { name: 'gui-set-color', nums: [120, 200, 255] },
        { name: 'gui-set-font', nums: [16, 0], text: 'sans' },
        { name: 'gui-set-position', nums: [24, 64] },
        { name: 'gui-draw-text', text: 'Tauri shell + Canvas backend' },
      ];

      async function loadFrame() {
        try {
          const res = await fetch('./frame.json');
          if (res.ok) return { entries: await res.json(), src: 'frame.json (captured game frame)' };
        } catch (_e) {
          /* fall through */
        }
        return { entries: fallbackFrame, src: 'inline demo frame' };
      }

      const { entries, src } = await loadFrame();
      document.getElementById('src').textContent = `source: ${src} — ${entries.length} commands`;

      const backend = new CanvasBackend(make);
      backend.applyAll(parseFrame(entries));

      const screen = document.getElementById('screen');
      const buf0 = backend.surface(0);
      if (buf0) screen.getContext('2d').drawImage(buf0, 0, 0);
    </script>
  </body>
</html>
