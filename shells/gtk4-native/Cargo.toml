# Native GTK4 shell for sumi (Phase 4, model A: command-stream / IPC).
#
# A live render loop: a CommandSource (a nelisp program's role) yields a frame of
# vocabulary each tick; the shell renders it via the Cairo backend into a GTK4
# window and feeds input (sumi-input) back. Standalone crate (own [workspace],
# parent excludes shells/) so the GTK4 dep tree stays out of CI.
#
# Build/run (Windows: GNU toolchain + MSYS2 GTK4 on PATH/PKG_CONFIG_PATH):
#   cargo +stable-x86_64-pc-windows-gnu run            # built-in movable-box demo
#   SUMI_STDIN=1 cargo +... run  < frames.ndjson # a nelisp program's stream

[package]
name = "sumi-gtk4-native"
version = "0.0.0"
edition = "2021"
description = "Native GTK4 shell — live render loop over the sumi command stream"
license = "CC0-1.0"

[workspace]

[dependencies]
sumi-core = { path = "../../crates/sumi-core" }
sumi-cairo = { path = "../../crates/sumi-cairo" }
sumi-input = { path = "../../crates/sumi-input" }
gtk4 = "0.9"
cairo-rs = { version = "0.20", features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# live render loop (movable-box demo / stdin stream)
[[bin]]
name = "sumi-gtk4-native"
path = "src/main.rs"

# replay a captured game command stream natively (sumi-title-stream.json)
[[bin]]
name = "sumi-replay"
path = "src/replay.rs"

# live: a TCP server that renders a game's streamed frames natively in real time
[[bin]]
name = "sumi-live"
path = "src/live.rs"
